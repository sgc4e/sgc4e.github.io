<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="canonical" href="https://sgc4e.github.io/">
<title>Saurabh Garg · Built on GitHub</title>
<meta name="description" content="Everything Saurabh Garg has built on GitHub since February 2025: products, client sites, tools and research.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site">
  <a class="brand" href="./">Saurabh Garg</a>
  <span class="tag">Built on GitHub</span>
</header>
<main class="page">
  <section class="masthead">
    <p class="kicker" id="kicker">Since 14 February 2025</p>
    <h1 id="headline">Everything I have built since my first commit.</h1>
    <p class="sub" id="intro"></p>
  </section>

  <nav class="filters" id="filters" aria-label="Filter by category"></nav>

  <div id="list" aria-live="polite">
    <div class="skel"><span></span><span></span><span></span></div>
    <div class="skel"><span></span><span></span><span></span></div>
    <div class="skel"><span></span><span></span><span></span></div>
  </div>
</main>
<footer class="site-foot">
  <p id="closer"></p>
  <p class="small"><a href="privacy.html">Privacy</a> · <a href="privacy.html#terms">Terms</a></p>
</footer>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;
const month = d => new Date(d).toLocaleDateString('en-GB', {month:'long', year:'numeric'});

let all = [], active = 'All';

function render() {
  const items = active === 'All' ? all : all.filter(p => p.category === active);
  const groups = {};
  for (const p of items) (groups[month(p.date)] ||= []).push(p);
  document.getElementById('list').innerHTML = Object.entries(groups).map(([m, ps]) => `
    <section class="month">
      <h2>${esc(m)} <span class="count">${ps.length}</span></h2>
      <ul>${ps.map(p => {
        const link = safeUrl(p.link), code = safeUrl(p.repo);
        return `<li class="item">
          <div class="meta"><span>${esc(p.category)}</span><span class="status s-${esc((p.status||'').toLowerCase())}">${esc(p.status)}</span></div>
          <h3>${link ? `<a href="${esc(link)}" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</h3>
          <p>${esc(p.blurb)}</p>
          ${link || code ? `<p class="links">${link ? `<a href="${esc(link)}" rel="noopener">Visit</a>` : ''}${code ? `<a href="${esc(code)}" rel="noopener">Code</a>` : ''}</p>` : ''}
        </li>`;}).join('')}</ul>
    </section>`).join('') || '<p class="empty">Nothing here yet.</p>';
}

function filters() {
  const cats = ['All', ...new Set(all.map(p => p.category))];
  const nav = document.getElementById('filters');
  nav.innerHTML = cats.map(c => {
    const n = c === 'All' ? all.length : all.filter(p => p.category === c).length;
    return `<button type="button" aria-pressed="${c === active}" data-c="${esc(c)}">${esc(c)} <span>${n}</span></button>`;
  }).join('');
  nav.onclick = e => { const b = e.target.closest('button'); if (!b) return; active = b.dataset.c; filters(); render(); };
}

fetch('projects.json', {cache: 'no-cache'}).then(r => r.json()).then(d => {
  const s = d.site || {};
  if (s.kicker) document.getElementById('kicker').textContent = s.kicker;
  if (s.headline) document.getElementById('headline').textContent = s.headline;
  document.getElementById('intro').textContent = s.intro || '';
  document.getElementById('closer').textContent = s.closer || '';
  all = (d.projects || []).sort((a, b) => b.date.localeCompare(a.date));
  filters(); render();
}).catch(() => { document.getElementById('list').innerHTML = '<p class="empty">Could not load the list. Refresh to try again.</p>'; });
</script>
</body>
</html>
